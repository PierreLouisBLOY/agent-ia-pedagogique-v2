[project]
name = "agent-ia-pedagogique-v2"
version = "0.0.0"
description = "Clean-room implementation of the Projet V2 pedagogical AI agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=3.5,<4"]

[project.optional-dependencies]
calibration = ["anthropic>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
warn_unused_configs = true
